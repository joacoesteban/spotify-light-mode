name: Publish extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to browser stores
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag version v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: Package Chrome extension
        run: bun run zip

      - name: Package Firefox extension
        run: bun run zip:firefox

      - name: Install fnox
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: fnox

      - name: Mask store credentials
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
        run: |
          for key in $(yq -p toml -o yaml '.profiles.ci.secrets | to_entries | .[] | select(.value.provider == "age") | .key' fnox.toml); do
            fnox -P ci get "$key" | jq -Rr 'select(length > 0) | "::add-mask::" + .'
          done

      - name: Submit to Chrome Web Store and Firefox Add-ons
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
        run: >
          fnox -P ci exec -- bun wxt submit
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
