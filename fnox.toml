[profiles.ci]
default_provider = "age"

# The first recipient is the publish workflow's key, whose identity is the
# FNOX_AGE_KEY repository secret; `mise run ci:key` replaces it. The second is
# the maintainer's Mac, the only place that can re-encrypt: its identity only
# unwraps in that Mac's Secure Enclave, and `mise run ci:mac-key` replaces it.
[profiles.ci.providers.age]
type = "age"
recipients = [
    "age1hxyx26mssf4gk2wsjaynghzt73n8lhehsvv2khzjrs3wd70hwcgs527cmp",
    "age1tag1qgt2v70ym6k994v6qsnefm45ycfl2nk64zr09a6y6gckf006jw6dxatr4pa",
]
key_file = "age-se.txt"

[profiles.ci.providers.plain]
type = "plain"

[profiles.ci.secrets]
CHROME_PUBLISHER_ID= { provider = "plain", value = "33fae000-ca9f-4a7b-b5af-f0111b0e68ab" }
CHROME_EXTENSION_ID= { provider = "plain", value = "lengbgflhbbajjfklllkaiookcpkkdbl" }
CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL= { provider = "age", value = "", env = "exec" }
CHROME_SERVICE_ACCOUNT_PRIVATE_KEY= { provider = "age", value = "", env = "exec" }
FIREFOX_JWT_ISSUER= { provider = "age", value = "fnox-age-batch-v1::UJLooodmDhDWcoUEaJY5u1Jxs+xbVH+YYyu1hh6oriJNCyzuNNApZvcOERL7", env = "exec" }
FIREFOX_JWT_SECRET= { provider = "age", value = "fnox-age-batch-v1::imYWU4HO8busEO2MsDtobvcj7vg9RmAQlKvrJvVhhHUiCvdDHtsnG1N2j3H5R0hWk2Dsfotn3ngF0jgJCZ7fBkr465boIQWkIvv6wl2OW5+79vsuySpg9UovlpA=", env = "exec" }
CHROME_API_VERSION= { provider = "plain", value = "v2" }
FIREFOX_EXTENSION_ID= { provider = "plain", value = "spotify-light-mode@joaco.io" }
FIREFOX_CHANNEL= { provider = "plain", value = "listed" }
CHROME_CANCEL_PENDING= { provider = "plain", value = "true" }
